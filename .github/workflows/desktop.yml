# Baut die Windows-PC-App und hängt sie an ein GitHub-Release.
# Auslösen: einen Tag wie v0.1.1 hochladen (oder manuell unter "Actions" starten).
name: PC-App bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Windows-App bauen (Installer + portable .exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Codex-des-Blutmondes-Windows
          path: dist/*.exe

      - name: Release mit Download erstellen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Codex des Blutmondes ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            **Download für Windows**
            - `Codex-des-Blutmondes-Setup-….exe`: Installer mit Desktop-Verknüpfung
            - `Codex-des-Blutmondes-…-portable.exe`: ohne Installation, einfach starten

            Hinweis: Die App ist nicht signiert. Windows SmartScreen zeigt beim ersten Start eventuell eine Warnung – dann „Weitere Informationen“ → „Trotzdem ausführen“.
